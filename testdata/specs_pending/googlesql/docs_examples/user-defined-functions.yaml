spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "user-defined-functions#6 L514 JavaScript UDF examples"
    sql: |-
      CREATE TEMP FUNCTION CustomGreeting(a STRING)
      RETURNS STRING
      LANGUAGE js
      AS r'''
        var d = new Date();
        if (d.getHours() < 12) {
          return 'Good Morning, ' + a + '!';
        } else {
          return 'Good Evening, ' + a + '!';
        }
      ''';
      SELECT CustomGreeting(names) as everyone
      FROM UNNEST(["Hannah", "Max", "Jakob"]) AS names
    expected:
      rows:
        - ["Good Morning, Hannah!"]
        - ["Good Morning, Max!"]
        - ["Good Morning, Jakob!"]
      unordered: true
  - desc: "user-defined-functions#11 L675 JavaScript UDF examples"
    sql: |-
      CREATE TEMP FUNCTION AddValues(x INT64, y INT64 DEFAULT 50, z INT64 DEFAULT 100)
      RETURNS INT64
      LANGUAGE js
      AS r'''
        return x*y*z;
      ''';
      SELECT AddValues(1, 2) AS result
    expected:
      rows:
        - ["200"]
