spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "pipe-syntax#7 L582 SELECT` pipe operator"
    setup:
      - |-
        CREATE OR REPLACE TABLE Produce AS (
          SELECT 'apples' AS item, 2 AS sales, 'fruit' AS category
          UNION ALL
          SELECT 'carrots' AS item, 8 AS sales, 'vegetable' AS category
          UNION ALL
          SELECT 'apples' AS item, 7 AS sales, 'fruit' AS category
          UNION ALL
          SELECT 'bananas' AS item, 5 AS sales, 'fruit' AS category
        )
    sql: |-
      -- Window function with a named window
      FROM Produce
      |> SELECT item, sales, category, SUM(sales) OVER item_window AS category_total
         WINDOW item_window AS (PARTITION BY category)
    expected:
      rows:
        - ["apples","2","fruit","14"]
        - ["apples","7","fruit","14"]
        - ["bananas","5","fruit","14"]
        - ["carrots","8","vegetable","8"]
      unordered: true
  - desc: "pipe-syntax#10 L672 EXTEND` pipe operator"
    setup:
      - |-
        CREATE OR REPLACE TABLE Produce AS (
          SELECT 'apples' AS item, 2 AS sales, 'fruit' AS category
          UNION ALL
          SELECT 'carrots' AS item, 8 AS sales, 'vegetable' AS category
          UNION ALL
          SELECT 'apples' AS item, 7 AS sales, 'fruit' AS category
          UNION ALL
          SELECT 'bananas' AS item, 5 AS sales, 'fruit' AS category
        )
    sql: |-
      -- Window function with a named window
      FROM Produce
      |> EXTEND SUM(sales) OVER item_window AS category_total
         WINDOW item_window AS (PARTITION BY category)
    expected:
      rows:
        - ["apples","fruit","14"]
        - ["apples","fruit","14"]
        - ["bananas","fruit","14"]
        - ["carrots","vegetable","8"]
      unordered: true
  - desc: "pipe-syntax#22 L1178 DISTINCT` pipe operator"
    sql: |-
      (
        SELECT 'apples' AS item, 2 AS sales
        UNION ALL
        SELECT 'bananas' AS item, 5 AS sales
        UNION ALL
        SELECT 'bananas' AS item, 5 AS sales
        UNION ALL
        SELECT 'carrots' AS item, 8 AS sales
