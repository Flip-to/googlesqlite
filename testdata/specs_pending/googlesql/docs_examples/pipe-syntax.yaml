        - ["table1       col1, col2"]
        - ["table2       col3, \u003cunnamed\u003e, col5"]
      unordered: true
  - desc: "pipe-syntax#60 L2667 DESCRIBE` pipe operator"
    sql: |-
      -- Describe CTEs and ordering.

