  - desc: "pipe-syntax#59 L2634 DESCRIBE` pipe operator"
    sql: |-
      -- Same example with DESCRIBE to describe table aliases and columns.

      FROM
        (SELECT 1 AS col1, 2 AS col2) AS table1,
