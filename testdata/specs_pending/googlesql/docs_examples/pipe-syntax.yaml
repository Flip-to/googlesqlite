  - desc: "pipe-syntax#36 L1803 RECURSIVE UNION` pipe operator"
    sql: |-
      CREATE TEMP TABLE Employees(
        employee_id INT64,
        manager_id INT64,
        state STRING);
      FROM Employees
      |> WHERE employee_id = 123456
      |> RECURSIVE UNION ALL
         (
           |> JOIN Employees e ON e.manager_id = AllReportees.employee_id
           |> SELECT e.*
         ) AS AllReportees
      |> WHERE State = 'AK'
      |> AGGREGATE COUNT(*) AS num_employees
    expected:
      rows:
        - ["46"]
  - desc: "pipe-syntax#37 L1830 RECURSIVE UNION` pipe operator"
    sql: |-
      CREATE TEMP TABLE Employees(
        employee_id INT64,
        manager_id INT64,
        state STRING);
      FROM Employees
      |> WHERE employee_id = 123456
      |> RECURSIVE UNION ALL
      (
        FROM AllReportees r  -- Recursive input table
        |> JOIN Employees e ON e.manager_id = r.employee_id
        |> SELECT e.*
      ) AS AllReportees
      |> WHERE State = 'AK'
      |> AGGREGATE COUNT(*) AS num_employees
    expected:
      rows:
        - ["46"]
