spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "conversion_functions#7 L1490 CAST AS JSON"
    sql: |-
      SELECT
        CAST(1 AS JSON) AS json_number,
        CAST('foo' AS JSON) AS json_string,
        CAST(TRUE AS JSON) AS json_boolean,
        CAST([1, 2, 3] AS JSON) AS json_array,
        CAST(STRUCT('foo' AS a, TRUE AS b) AS JSON) AS json_object
    expected:
      rows:
        - ["1","\"foo\"","true","[1,2,3]","{\"a\":\"foo\",\"b\":true}"]
  - desc: "conversion_functions#8 L1512 CAST AS JSON"
    sql: |-
      SELECT
        CAST(NULL AS JSON) AS json_null,
        CAST(STRUCT(1 AS a, NULL AS b) AS JSON) AS json_object_with_null,
        CAST([1, NULL, 3] AS JSON) AS json_array_with_null
    expected:
      rows:
        - [null,"{\"a\":1,\"b\":null}","[1,null,3]"]
  - desc: "conversion_functions#9 L1564 CAST AS INTERVAL"
    sql: |-
      SELECT input, CAST(input AS INTERVAL) AS output
      FROM UNNEST([
        '1-2 3 10:20:30.456',
        '1-2',
        '10:20:30',
        'P1Y2M3D',
        'PT10H20M30,456S'
      ]) input
    expected:
      rows:
        - ["1-2 3 10:20:30.456","1-2 3 10:20:30.456"]
        - ["1-2","1-2 0 0:0:0"]
        - ["10:20:30","0-0 0 10:20:30"]
        - ["P1Y2M3D","1-2 3 0:0:0"]
        - ["PT10H20M30,456S","0-0 0 10:20:30.456"]
      unordered: true
  - desc: "conversion_functions#10 L1624 CAST AS MAP"
    sql: |-
      SELECT
        CAST(input_map AS MAP<BYTES, INT64>) AS results
      FROM
        MAP_FROM_ARRAY([('x', 1), ('y', 2), ('z', 3)]) AS input_map
    expected:
      rows:
        - ["{b'x': 1, b'y': 2, b'z': 3}"]
  - desc: "conversion_functions#11 L1637 CAST AS MAP"
