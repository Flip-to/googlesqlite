  - desc: "operators#68 L3641 Quantified `LIKE` operator"
    setup:
      - |-
        CREATE TABLE Words AS SELECT 'Intend with clarity.' as value UNION ALL
          SELECT 'Secure with intention.' UNION ALL
          SELECT 'Clarity and security.'
    sql: |-
      SELECT * FROM Words WHERE value LIKE ANY (SELECT '%with%')
    expected:
      rows:
        - ["Intend with clarity."]
        - ["Secure with intention."]
      unordered: true
