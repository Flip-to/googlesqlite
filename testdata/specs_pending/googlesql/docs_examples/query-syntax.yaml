  - desc: "query-syntax#46 L2374 LATERAL` join"
    setup:
      - |-
        CREATE TABLE Roster AS SELECT 'Adams' as LastName, 50 as SchoolID UNION ALL
          SELECT 'Buchanan', 52 UNION ALL
          SELECT 'Coolidge', 52 UNION ALL
          SELECT 'Davis', 51 UNION ALL
          SELECT 'Eisenhower', 77
      - |-
        CREATE TABLE PlayerStats AS SELECT 'Adams' as LastName, 51 as OpponentID, 3 as PointsScored UNION ALL
          SELECT 'Buchanan', 77, 0 UNION ALL
          SELECT 'Coolidge', 77, 1 UNION ALL
          SELECT 'Adams', 52, 4 UNION ALL
          SELECT 'Buchanan', 50, 13
    sql: |-
      SELECT R.SchoolID, OP.LastName AS TopOpPlayer, OP.PointsScored
      FROM Roster AS R,
        LATERAL(
          SELECT PS.LastName, PS.PointsScored
          FROM PlayerStats AS PS
          WHERE PS.OpponentID = R.SchoolID
          ORDER BY PointsScored DESC
          LIMIT 1
        ) AS OP
      ORDER BY R.SchoolID
    expected:
      rows:
        - ["50","Buchanan","13"]
        - ["51","Adams","3"]
        - ["52","Adams","4"]
        - ["57","Coolidge","1"]
  - desc: "query-syntax#47 L2402 LATERAL` join"
    setup:
      - |-
        CREATE TABLE Roster AS SELECT 'Adams' as LastName, 50 as SchoolID UNION ALL
          SELECT 'Buchanan', 52 UNION ALL
          SELECT 'Coolidge', 52 UNION ALL
          SELECT 'Davis', 51 UNION ALL
          SELECT 'Eisenhower', 77
      - |-
        CREATE TABLE TeamMascot AS SELECT 50 as SchoolID, 'Jaguars' as Mascot UNION ALL
          SELECT 51, 'Knights' UNION ALL
          SELECT 52, 'Lakers' UNION ALL
          SELECT 53, 'Mustangs'
    sql: |-
      SELECT R.LastName, R.SchoolID, M.Mascot
      FROM Roster AS R
      LEFT JOIN
        LATERAL(
          SELECT Mascot
          FROM TeamMascot m
          WHERE m.SchoolID = R.SchoolID
        ) AS M
      ORDER BY R.LastName
    expected:
      rows:
        - ["Adams","50","Jaguars"]
        - ["Buchanan","52","Lakers"]
        - ["Coolidge","52","Lakers"]
        - ["Davis","51","Knights"]
        - ["Eisenhower","77",null]
  - desc: "query-syntax#66 L3823 Group rows by `GROUPING SETS"
    sql: |-
      -- GROUP BY with GROUPING SETS
      WITH
        Products AS (
          SELECT 'shirt' AS product_type, 't-shirt' AS product_name, 3 AS product_count UNION ALL
          SELECT 'shirt', 't-shirt', 8 UNION ALL
          SELECT 'shirt', 'polo', 25 UNION ALL
          SELECT 'pants', 'jeans', 6
        )
      SELECT product_type, product_name, SUM(product_count) AS product_sum
      FROM Products
      GROUP BY GROUPING SETS (product_type, product_name)
      ORDER BY product_name
    expected:
      rows:
        - ["shirt",null,36]
        - ["pants",null,6]
        - [null,"jeans",6]
        - [null,"polo",25]
        - [null,"t-shirt",11]
