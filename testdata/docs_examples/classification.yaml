  # ---- format elements ------------------------------------------------
  format-elements#21:
    class: la_timezone
    reason: >-
      The docs format TIMESTAMP '2008-12-25 00:00:00+00' with TZH as -08
      (America/Los_Angeles); in UTC it is +00.
  format-elements#30:
    class: bigquery
    reason: >-
      format-elements.md, Format string as second part, documents
      CAST('01:05:07.16' AS TIME FORMAT 'HH24:MI:SS.FF1') as 01:05:07.2.
      BigQuery rejects the input: "Illegal non-space trailing data '6' in
      timestamp string".
    bigquery_error: "*"
  format-elements#32:
    class: bigquery
    reason: >-
      format-elements.md, Format string as time zone part, documents
      'YYYY.MM.DD HH:MI:SSTZH' as parsing. BigQuery rejects the format:
      "Format element in category MERIDIAN_INDICATOR is required when
      format element 'HH' exists".
    bigquery_error: "*"
  format-elements#33:
    class: bigquery
    reason: >-
      format-elements.md, Format numeric type as string: the table trims
      the output, but the prose says the output has a fixed width with
      one leading character for the sign. BigQuery returns the padded
      strings.
    bigquery_rows:
      - [1.2, "       $1.200"]
      - [12.3, "      $12.300"]
      - [123.456, "     $123.456"]
      - [1234.56, "   $1,234.560"]
      - [-12345.678, " -$12,345.678"]
      - [1234567.89, " $###,###.###"]
  format-elements#34:
    class: bigquery
    reason: >-
      format-elements.md, Format digits as string: the table trims the
      output. BigQuery returns '  12' and ' -12' (one position per digit
      element plus one for the sign).
    bigquery_rows:
      - ["  12", " -12"]
  format-elements#35:
    class: bigquery
    reason: >-
      format-elements.md, Format decimal point as string: the table trims
      the output. BigQuery returns ' 12.50'.
    bigquery_rows:
      - [" 12.50"]
  format-elements#37:
    class: bigquery
    reason: >-
      format-elements.md, Format currency symbol as string: the table
      trims the output. BigQuery returns ' $12' and '-$12'.
    bigquery_rows:
      - [" $12", "-$12"]
  format-elements#38:
    class: bigquery
    reason: >-
      format-elements.md, Format group separator as string: the table
      trims the output. BigQuery returns '   1,234'.
    bigquery_rows:
      - ["   1,234"]

  # ---- geography ------------------------------------------------------
  geography_functions#10:
    class: driver_bug
    reason: >-
      ST_CONVEXHULL is planar: BigQuery's S2 hull of LINESTRING(1 1, 2 2)
      keeps the geodesic midpoint (LINESTRING(2 2, 1.49988573656168
      1.5000570914792, 1 1)) and starts the polygon at another vertex.
      The docs print the hull of POINT(1 1) as POINT(0.999999999999943 1);
      BigQuery returns POINT(1 1), so the case waits for BigQuery's
      answer.
    bigquery_rows:
      - ["POINT(1 1)", "POINT(1 1)"]
      - ["LINESTRING(1 1, 2 2)", "LINESTRING(2 2, 1.49988573656168 1.5000570914792, 1 1)"]
      - ["MULTIPOINT(1 9, 4 12, 2 11, 1 12, 0 15)", "POLYGON((1 9, 4 12, 0 15, 1 9))"]
  geography_functions#11:
    class: driver_bug
    reason: >-
      ST_COVERS does not treat a polygon vertex as covered
      (ST_COVERS(POLYGON((1 1, 20 1, 10 20, 1 1)), POINT(1 1)) is TRUE in
      the docs).
  geography_functions#18:
    class: driver_bug
    reason: >-
      ST_EXTERIORRING keeps the input vertex order; BigQuery normalizes
      rings to S2 orientation (LINESTRING(2 2, 1 4, 0 0, 2 2)).
  geography_functions#19:
    class: driver_bug
    reason: >-
      Polygons keep the input vertex order; BigQuery normalizes them:
      ST_GEOGFROM('POLYGON((0 0, 0 2, 2 2, 2 0, 0 0))') prints as
      POLYGON((2 0, 2 2, 0 2, 0 0, 2 0)) (verified on BigQuery).
  geography_functions#23:
    class: driver_bug
    reason: >-
      ST_CONTAINS(ST_GEOGFROMTEXT(polygon), point) is FALSE for a point
      inside the polygon, and oriented => TRUE does not invert a
      clockwise ring.
  geography_functions#24:
    class: driver_bug
    reason: >-
      ST_GEOGFROMTEXT accepts a self-intersecting polygon (the docs return
      NULL under SAFE) and make_valid => TRUE does not repair it into a
      MULTIPOLYGON.
  geography_functions#39:
    class: driver_bug
    reason: >-
      ST_MAKELINE of an array of equal points (the docs return POINT(1 2))
      and of overlapping segments (a MULTILINESTRING) raises "needs at
      least 2 points".
  geography_functions#43:
    class: driver_bug
    reason: >-
      ST_SIMPLIFY does not collapse degenerate results to a LINESTRING or
      POINT as the docs show.
  geography_functions#45:
    class: driver_bug
    reason: >-
      ST_UNION of two touching linestrings returns a MULTILINESTRING;
      BigQuery merges them into one LINESTRING.

