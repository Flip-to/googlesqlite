  # ---- found by the 2026-09-25 BigQuery verification run ---------------
  timestamp_functions#38:
    class: bigquery
    reason: >-
      timestamp_functions.md, UNIX_MICROS, documents UNIX_MICROS(TIMESTAMP
      "1970-01-01 00:00:00.0000018+00") as 1. BigQuery keeps microsecond
      precision and rejects the seven-digit fraction: "Invalid TIMESTAMP
      literal". The driver accepts nanosecond literals
      (FEATURE_TIMESTAMP_NANOS is on), so the case stays pending.
    bigquery_error: "*"
