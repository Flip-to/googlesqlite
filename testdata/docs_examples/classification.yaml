  # ---- strings ----------------------------------------------------------
  string_functions#7:
    class: bigquery
    reason: >-
      string_functions.md, CHR, prints CHR(0) as an empty cell. BigQuery
      returns the NUL character (TO_HEX(CAST(CHR(0) AS BYTES)) is '00').
      CHR(0xF9B5) is U+F9B5, written as an escape here.
    bigquery_rows:
      - ["a", "例", "\u0000", null]
  string_functions#11:
    class: bigquery
    reason: >-
      string_functions.md, CODE_POINTS_TO_STRING, prints
      CODE_POINTS_TO_STRING([97, 0, 0xF9B5]) without the NUL. BigQuery
      keeps it: the UTF-8 bytes are 61 00 efa6b5.
    bigquery_rows:
      - ["a\u0000例"]
  string_functions#13:
    class: nondeterministic
    reason: ORDER BY 2 DESC ties the letters that share a count; their order is unspecified.
  string_functions#42:
