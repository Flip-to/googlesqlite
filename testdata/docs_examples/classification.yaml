      section (three rows); the docs show one row.
  string_functions#109:
    class: bigquery
    reason: >-
      string_functions.md, SPLIT, documents SPLIT('', ' ') as []. BigQuery
      returns [""] (ARRAY_LENGTH is 1).
    bigquery_rows:
      - [[""]]
      - [["a"]]
      - [["b", "c", "d"]]
  string_functions#145:
    class: bigquery
    reason: >-
      string_functions.md, TRIM, documents d as 'Ūaba'. BigQuery returns
      the input unchanged ('Ū' followed by U+030A, then 'aba'): the
      combining ring after the leading Ū is not removed.
    bigquery_rows:
      - ["abaW", "W̊aba", "abaŪ", "Ū̊aba"]
  subqueries#5:
