# Triage of every upstream reference-docs example (google/googlesql
# docs/*.md at d82db99) that does not pass exactly as documented.
# TestDocsExamples reads this file; see docs_examples_classes_test.go for
# what each class does. Keys are the example IDs `specctl
# extract-docs-examples` assigns (page#ordinal).
#
# Classes:
#   la_timezone      the docs print results under the America/Los_Angeles
#                    default time zone of the GoogleSQL reference
#                    implementation; the driver, like BigQuery, uses UTC.
#                    Skipped; the documented expectation is kept.
#   not_in_bigquery  the example uses a feature BigQuery does not have
#                    (property graphs, protos, MAP, INT32/UINT64/FLOAT
#                    types, functions absent from BigQuery, syntax
#                    BigQuery rejects). Skipped. Where noted, the
#                    BigQuery error was observed with the bq CLI.
#   nondeterministic the documented result depends on the environment,
#                    the time of day, or ties in an ORDER BY. Skipped.
#   docs_artifact    the documented table cannot be compared as printed
#                    (a column left out, a fixture defined for another
#                    section, a fragment that is not a query, a value the
#                    table rendering changes). Skipped.
#   bigquery         the docs contradict real BigQuery; the case follows
#                    BigQuery's answer (bigquery_rows, or bigquery_error:
#                    a substring of the expected error, "*" for any
#                    error). Every answer here was observed on BigQuery
#                    with the bq CLI on 2026-09-25.
#   analyzer         blocked by the go-googlesql v0.4.0 analyzer.
#                    Pending.
#   driver_bug       a real driver divergence not fixed yet. Pending.
cases:
  # ---- aggregate WHERE modifier -------------------------------------
  aggregate-function-calls#7:
    class: analyzer
    reason: >-
      BigQuery supports the aggregate WHERE modifier (COUNT(DISTINCT x
      WHERE x > 0) returns 3 there), but go-googlesql v0.4.0 exposes no
      where_expr accessor on ResolvedAggregateFunctionCall, and enabling
      FEATURE_AGGREGATE_FILTERING makes the analyzer accept the modifier
      while the filter is silently dropped.
  aggregate_functions#29:
    class: analyzer
    reason: >-
      Aggregate WHERE modifier; see aggregate-function-calls#7 (the
      go-googlesql v0.4.0 binding has no where_expr accessor).
  aggregate_functions#30:
    class: analyzer
    reason: >-
      Aggregate WHERE modifier; see aggregate-function-calls#7 (the
      go-googlesql v0.4.0 binding has no where_expr accessor).
  aggregate_functions#31:
    class: analyzer
    reason: >-
      Aggregate WHERE modifier; see aggregate-function-calls#7 (the
      go-googlesql v0.4.0 binding has no where_expr accessor).

  # ---- arrays ---------------------------------------------------------
  arrays#14:
    class: not_in_bigquery
    reason: >-
      Array subscript on a FROM-clause path without UNNEST; BigQuery
      rejects it with "Array element access is not allowed in the FROM
      clause without UNNEST".
  arrays#27:
    class: not_in_bigquery
    reason: ARRAY<INT32>; BigQuery has no INT32 type.
  bit_functions#2:
    class: not_in_bigquery
    reason: BIT_CAST_TO_UINT64 returns UINT64, a type BigQuery does not have.
  bit_functions#4:
    class: not_in_bigquery
    reason: BIT_CAST_TO_UINT64 returns UINT64, a type BigQuery does not have.

  # ---- collation ------------------------------------------------------
  collation-concepts#5:
    class: bigquery
    reason: >-
      collation-concepts.md, Caveats, prints the values as orange1,
      orange2, orange3, dropping the invisible U+2060 WORD JOINER from
      the inputs. BigQuery returns the strings unchanged,
      ["oran⁠ge1","⁠orange2","orange3"], in that order.
    bigquery_rows:
      - ["oran⁠ge1"]
      - ["⁠orange2"]
      - ["orange3"]

  # ---- conversion functions -------------------------------------------
  conversion_functions#7:
    class: not_in_bigquery
    reason: CAST(... AS JSON); BigQuery rejects it with "Invalid cast from INT64 to JSON".
  conversion_functions#8:
    class: not_in_bigquery
    reason: CAST(... AS JSON); BigQuery rejects it with "Invalid cast from INT64 to JSON".
  conversion_functions#10:
    class: not_in_bigquery
    reason: MAP type and MAP_FROM_ARRAY; BigQuery has no MAP type.
  conversion_functions#11:
    class: not_in_bigquery
    reason: MAP type and MAP_FROM_ARRAY; BigQuery has no MAP type.
  conversion_functions#13:
    class: bigquery
    reason: >-
      conversion_functions.md, CAST AS RANGE, prints bounds as typed
      literals ([DATE '2020-01-01', DATE '2020-01-02')). BigQuery returns
      [2020-01-01, 2020-01-02).
    bigquery_rows:
      - ["[2020-01-01, 2020-01-02)"]
  conversion_functions#14:
    class: bigquery
    reason: >-
      conversion_functions.md, CAST AS RANGE, prints bounds as typed
      literals with the input's precision. BigQuery's
      CAST(... AS STRING) of the result is
      [2014-09-27 12:30:00.450, 2016-10-17 11:15:00.330).
    bigquery_rows:
      - ["[2014-09-27 12:30:00.450, 2016-10-17 11:15:00.330)"]
  conversion_functions#15:
    class: nondeterministic
    reason: >-
      The docs say "Results depend upon where this query was executed" and
      print the bounds in +08; the rendering depends on the session time
      zone.
  conversion_functions#16:
    class: bigquery
    reason: >-
      conversion_functions.md, CAST AS RANGE, prints [UNBOUNDED, DATE
      '2020-01-02'). BigQuery returns [UNBOUNDED, 2020-01-02).
    bigquery_rows:
      - ["[UNBOUNDED, 2020-01-02)"]
  conversion_functions#17:
    class: bigquery
    reason: >-
      conversion_functions.md, CAST AS RANGE, prints [DATE '2020-01-01',
      UNBOUNDED). BigQuery returns [2020-01-01, UNBOUNDED).
    bigquery_rows:
      - ["[2020-01-01, UNBOUNDED)"]
  conversion_functions#20:
    class: la_timezone
    reason: >-
      The docs render TIMESTAMP '2008-12-25 00:00:00+00' as 2008-12-24
      16:00:00 -08:00 (America/Los_Angeles); in UTC it is 2008-12-25
      00:00:00 +00:00.
  conversion_functions#26:
    class: bigquery
    reason: >-
      conversion_functions.md, PARSE_BIGNUMERIC, documents
      PARSE_BIGNUMERIC("123.456E37") as 1234 followed by 35 zeros, but
      123.456E37 is 1.23456e39, above the BIGNUMERIC maximum. BigQuery
      raises "Invalid input to PARSE_BIGNUMERIC".
    bigquery_error: "*"

  # ---- data definition / data types -----------------------------------
  data-definition-language#2:
    class: not_in_bigquery
    reason: CREATE CONSTANT; BigQuery has no named constants.
  data-types#1:
    class: not_in_bigquery
    reason: >-
      ORDER BY an ARRAY; BigQuery rejects it with "ORDER BY does not
      support expressions of type ARRAY<INT64>".
  data-types#3:
    class: docs_artifact
    reason: >-
      The docs print the NULL array as []: BigQuery's result API renders a
      NULL ARRAY as an empty array, but the value is NULL (numbers IS
      NULL is true on BigQuery, as the example's third column shows). The
      driver returns the NULL.
  data-types#15:
    class: bigquery
    reason: >-
      data-types.md, Daylight saving time, prints "Sun Nov 3 08:30:00 2024
      UTC". BigQuery's %c pads the day of month with a space, as C
      asctime does: "Sun Nov  3 08:30:00 2024 UTC".
    bigquery_rows:
      - ["Sun Nov  3 08:30:00 2024 UTC", "Sun Nov  3 10:30:00 2024 UTC"]

