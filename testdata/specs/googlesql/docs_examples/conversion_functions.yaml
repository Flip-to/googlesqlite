cases:
  # Verified on BigQuery 2026-09-25.
  - desc: "conversion_functions#5 L1404 CAST AS Integer"
    sql: |-
      SELECT '0x123' as hex_value, CAST('0x123' as INT64) as hex_to_int
    expected:
      rows:
        - ["0x123",291]
  # Verified on BigQuery 2026-09-25.
  - desc: "conversion_functions#6 L1414 CAST AS Integer"
    sql: |-
      SELECT '-0x123' as hex_value, CAST('-0x123' as INT64) as hex_to_int
    expected:
      rows:
        - ["-0x123",-291]
  - desc: "conversion_functions#7 L1490 CAST AS JSON"
    skip: "not_in_bigquery: CAST(... AS JSON); BigQuery rejects it with \"Invalid cast from INT64 to JSON\"."
    sql: |-
      SELECT
        CAST(1 AS JSON) AS json_number,
        CAST('foo' AS JSON) AS json_string,
        CAST(TRUE AS JSON) AS json_boolean,
        CAST([1, 2, 3] AS JSON) AS json_array,
        CAST(STRUCT('foo' AS a, TRUE AS b) AS JSON) AS json_object
    expected:
      rows:
        - ["1","\"foo\"","true","[1,2,3]","{\"a\":\"foo\",\"b\":true}"]
  - desc: "conversion_functions#8 L1512 CAST AS JSON"
    skip: "not_in_bigquery: CAST(... AS JSON); BigQuery rejects it with \"Invalid cast from INT64 to JSON\"."
    sql: |-
      SELECT
        CAST(NULL AS JSON) AS json_null,
        CAST(STRUCT(1 AS a, NULL AS b) AS JSON) AS json_object_with_null,
        CAST([1, NULL, 3] AS JSON) AS json_array_with_null
    expected:
      rows:
        - [null,"{\"a\":1,\"b\":null}","[1,null,3]"]
  # Verified on BigQuery 2026-09-25.
  - desc: "conversion_functions#9 L1564 CAST AS INTERVAL"
    sql: |-
      SELECT input, CAST(input AS INTERVAL) AS output
      FROM UNNEST([
        '1-2 3 10:20:30.456',
        '1-2',
        '10:20:30',
        'P1Y2M3D',
        'PT10H20M30,456S'
      ]) input
    expected:
      rows:
        - ["1-2 3 10:20:30.456","1-2 3 10:20:30.456"]
        - ["1-2","1-2 0 0:0:0"]
        - ["10:20:30","0-0 0 10:20:30"]
        - ["P1Y2M3D","1-2 3 0:0:0"]
        - ["PT10H20M30,456S","0-0 0 10:20:30.456"]
      unordered: true
  - desc: "conversion_functions#10 L1624 CAST AS MAP"
    skip: "not_in_bigquery: MAP type and MAP_FROM_ARRAY; BigQuery has no MAP type."
    sql: |-
      SELECT
        CAST(input_map AS MAP<BYTES, INT64>) AS results
      FROM
        MAP_FROM_ARRAY([('x', 1), ('y', 2), ('z', 3)]) AS input_map
    expected:
      rows:
        - ["{b'x': 1, b'y': 2, b'z': 3}"]
  - desc: "conversion_functions#11 L1637 CAST AS MAP"
    skip: "not_in_bigquery: MAP type and MAP_FROM_ARRAY; BigQuery has no MAP type."
    sql: |-
      SELECT
        CAST(input_map AS MAP<STRING, STRING>) AS results
      FROM
        MAP_FROM_ARRAY([(b'x', b'\x41'), (b'y', b'\x42')]) AS input_map
    expected:
      rows:
        - ["{\"x\": \"\\x41\", \"y\": \"\\x42\"}"]
  # Follows BigQuery, not the docs: conversion_functions.md, CAST AS RANGE, prints bounds as typed literals ([DATE '2020-01-01', DATE '2020-01-02')). BigQuery returns [2020-01-01, 2020-01-02).
  # Verified on BigQuery 2026-09-25.
  - desc: "conversion_functions#13 L1834 CAST AS RANGE"
    sql: |-
      SELECT CAST(
        '[2020-01-01, 2020-01-02)'
        AS RANGE<DATE>) AS string_to_range
    expected:
      rows:
        - ["[2020-01-01, 2020-01-02)"]
  # Follows BigQuery, not the docs: conversion_functions.md, CAST AS RANGE, prints bounds as typed literals with the input's precision. BigQuery's CAST(... AS STRING) of the result is [2014-09-27 12:30:00.450, 2016-10-17 11:15:00.330).
  # Verified on BigQuery 2026-09-25.
  - desc: "conversion_functions#14 L1846 CAST AS RANGE"
    sql: |-
      SELECT CAST(
        '[2014-09-27 12:30:00.45, 2016-10-17 11:15:00.33)'
        AS RANGE<DATETIME>) AS string_to_range
    expected:
      rows:
        - ["[2014-09-27 12:30:00.450, 2016-10-17 11:15:00.330)"]
  - desc: "conversion_functions#15 L1858 CAST AS RANGE"
    skip: "nondeterministic: The docs say \"Results depend upon where this query was executed\" and print the bounds in +08; the rendering depends on the session time zone."
    sql: |-
      SELECT CAST(
        '[2014-09-27 12:30:00+08, 2016-10-17 11:15:00+08)'
        AS RANGE<TIMESTAMP>) AS string_to_range

      -- Results depend upon where this query was executed.
    expected:
      rows:
        - ["[TIMESTAMP '2014-09-27 12:30:00+08', TIMESTAMP '2016-10-17 11:15:00+08')"]
  # Follows BigQuery, not the docs: conversion_functions.md, CAST AS RANGE, prints [UNBOUNDED, DATE '2020-01-02'). BigQuery returns [UNBOUNDED, 2020-01-02).
  # Verified on BigQuery 2026-09-25.
  - desc: "conversion_functions#16 L1871 CAST AS RANGE"
    sql: |-
      SELECT CAST(
        '[UNBOUNDED, 2020-01-02)'
        AS RANGE<DATE>) AS string_to_range
    expected:
      rows:
        - ["[UNBOUNDED, 2020-01-02)"]
  # Follows BigQuery, not the docs: conversion_functions.md, CAST AS RANGE, prints [DATE '2020-01-01', UNBOUNDED). BigQuery returns [2020-01-01, UNBOUNDED).
  # Verified on BigQuery 2026-09-25.
  - desc: "conversion_functions#17 L1883 CAST AS RANGE"
    sql: |-
      SELECT CAST(
        '[2020-01-01, NULL)'
        AS RANGE<DATE>) AS string_to_range
    expected:
      rows:
        - ["[2020-01-01, UNBOUNDED)"]
  # Verified on BigQuery 2026-09-25.
  - desc: "conversion_functions#20 L2086 CAST AS STRING"
    skip: "la_timezone: The docs render TIMESTAMP '2008-12-25 00:00:00+00' as 2008-12-24 16:00:00 -08:00 (America/Los_Angeles); in UTC it is 2008-12-25 00:00:00 +00:00."
    sql: |-
      SELECT CAST(
        TIMESTAMP '2008-12-25 00:00:00+00:00'
        AS STRING FORMAT 'YYYY-MM-DD HH24:MI:SS TZH:TZM') AS date_time_to_string

      -- Results depend upon where this query was executed.
    expected:
      rows:
        - ["2008-12-24 16:00:00 -08:00"]
  # Verified on BigQuery 2026-09-25.
  - desc: "conversion_functions#21 L2099 CAST AS STRING"
    sql: |-
      SELECT CAST(
        TIMESTAMP '2008-12-25 00:00:00+00:00'
        AS STRING FORMAT 'YYYY-MM-DD HH24:MI:SS TZH:TZM'
        AT TIME ZONE 'Asia/Kolkata') AS date_time_to_string

      -- Because the time zone is specified, the result is always the same.
    expected:
      rows:
        - ["2008-12-25 05:30:00 +05:30"]
  # Verified on BigQuery 2026-09-25.
  - desc: "conversion_functions#22 L2113 CAST AS STRING"
    sql: |-
      SELECT CAST(INTERVAL 3 DAY AS STRING) AS interval_to_string
    expected:
      rows:
        - ["0-0 3 0:0:0"]
  # Verified on BigQuery 2026-09-25.
  - desc: "conversion_functions#23 L2123 CAST AS STRING"
    sql: |-
      SELECT CAST(
        INTERVAL "1-2 3 4:5:6.789" YEAR TO SECOND
