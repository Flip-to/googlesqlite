        - ["123.45"]
  # Follows BigQuery, not the docs: conversion_functions.md, PARSE_BIGNUMERIC, documents PARSE_BIGNUMERIC("123.456E37") as 1234 followed by 35 zeros, but 123.456E37 is 1.23456e39, above the BIGNUMERIC maximum. BigQuery raises "Invalid input to PARSE_BIGNUMERIC".
