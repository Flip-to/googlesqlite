      FROM UNNEST([2, 1, -2, 3, -2, 1, 2]) AS x
    expected:
      rows:
        - [[1,1,2,-2,-2,2,3]]
  # Verified on BigQuery 2026-09-25.
  - desc: "aggregate_functions#11 L753 ARRAY_AGG"
    sql: |-
      WITH vals AS
        (
          SELECT 1 x UNION ALL
          SELECT -2 x UNION ALL
          SELECT 3 x UNION ALL
          SELECT -2 x UNION ALL
          SELECT 1 x
        )
      SELECT ARRAY_AGG(DISTINCT x ORDER BY x) as array_agg
      FROM vals
    expected:
      rows:
        - [[-2,1,3]]
