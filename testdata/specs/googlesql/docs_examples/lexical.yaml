# Generated by TestDocsExamples from google/googlesql@d82db99 docs/lexical.md.
# Expected values are the documented result tables, typed with the
# column types the analyzer reports, except where a case says it
# follows BigQuery (see testdata/docs_examples/classification.yaml).
# Cases with `skip:` keep the documented expectation but do not run.
# Do not edit by hand.
spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "lexical#1 L254 Tokens in literals"
    sql: |-
      -- Error: string and bytes tokens can't be used together in the same literal.
        SELECT 'x' b'y'
    expected:
      error:
        contains: ""
  - desc: "lexical#2 L271 Tokens in literals"
    sql: |-
      -- Compatible format types can be used together in a string literal.
        SELECT 'abc' "d" '''ef'''
    expected:
      rows:
        - ["abcdef"]
  - desc: "lexical#3 L280 Tokens in literals"
    sql: |-
      -- \n is escaped in the raw string token but not in the quoted string token.
        SELECT '\na' r"\n"
    expected:
      rows:
        - ["\na\\n"]
  - desc: "lexical#4 L301 Tokens in literals"
    sql: |-
      -- Compatible format types can be used together in a bytes literal.
        SELECT b'\x41' b'''\x42''' b"""\x41"""
    expected:
      rows:
        - ["QUJB"]
  - desc: "lexical#5 L310 Tokens in literals"
    sql: |-
      -- Control characters are escaped in the raw bytes tokens but not in the
        -- bytes token.
        SELECT b'\x41' RB'\x42' br'\x41'
    expected:
      rows:
        - ["QVx4NDJceDQx"]
  - desc: "lexical#6 L322 Tokens in literals"
    sql: |-
      -- The following JSON literal is equivalent to: JSON '{"name":"my_file.md","regex":"\\d+"}'
      SELECT JSON '{"name": "my_file.md", "regex": ' /*start*/ r' "\\d+"' /*end*/ '}'
    expected:
      rows:
        - ["{\"name\":\"my_file.md\",\"regex\":\"\\\\d+\"}"]
  - desc: "lexical#7 L331 Tokens in literals"
    sql: |-
      -- The following NUMERIC literal is equivalent to: NUMERIC '-1.2'
      SELECT NUMERIC '-' "1" '''.''' r'2'
    expected:
      rows:
        - ["-1.2"]
  - desc: "lexical#8 L349 Tokens in literals"
    sql: |-
      -- The following DATE literal is equivalent to: DATE '2014-01-31'
      SELECT DATE /* year */ '2014' /* month and day */ "-01-31"
    expected:
      rows:
        - ["2014-01-31"]
  - desc: "lexical#9 L358 Tokens in literals"
    sql: |-
      -- Error: Illegal escape sequence found in '\def'.
      SELECT r'abc' '\def'
    expected:
      error:
        contains: ""
  - desc: "lexical#10 L363 Tokens in literals"
    sql: |-
      -- Error: backticks are reserved for quoted identifiers and not a valid
      -- format type.
      SELECT `abc` `def` AS results
    expected:
      error:
        contains: ""
  - desc: "lexical#11 L1123 Interval literal with a datetime part range"
    sql: |-
      -- Produces an error because the negative sign for minutes must come before the hour.
      SELECT INTERVAL '-23-2 10 0:-30' YEAR TO MINUTE
    expected:
      error:
        contains: ""
  - desc: "lexical#12 L1123 Interval literal with a datetime part range"
    sql: |-
      -- Produces an error because the negative sign for months must come before the year.
      SELECT INTERVAL '23--2 10 0:30' YEAR TO MINUTE
    expected:
      error:
        contains: ""
