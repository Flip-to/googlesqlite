# Cases with `skip:` keep the documented expectation but do not run.
# Do not edit by hand.
spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "operators#1 L644 Field access operator"
    sql: |-
      SELECT
        STRUCT(
          STRUCT('Yonge Street' AS street, 'Canada' AS country)
            AS address).address.country
    expected:
      rows:
        - ["Canada"]
  - desc: "operators#2 L718 Array subscript operator"
    sql: |-
      SELECT
        ["coffee", "tea", "milk"] AS item_array,
        ["coffee", "tea", "milk"][0] AS item_index,
        ["coffee", "tea", "milk"][OFFSET(0)] AS item_offset,
        ["coffee", "tea", "milk"][ORDINAL(1)] AS item_ordinal,
        ["coffee", "tea", "milk"][SAFE_OFFSET(6)] AS item_safe_offset
    expected:
      rows:
        - [["coffee","tea","milk"],"coffee","coffee","coffee",null]
  - desc: "operators#3 L737 Array subscript operator"
    sql: |-
      -- Error. Array index 6 is out of bounds.
      SELECT ["coffee", "tea", "milk"][6] AS item_offset
    expected:
      error:
        contains: ""
  - desc: "operators#4 L742 Array subscript operator"
    sql: |-
