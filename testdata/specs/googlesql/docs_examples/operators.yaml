    expected:
      rows:
        - ["2021-04-21T01:00:00","2021-05-02 00:00:52.345000+00"]
  - desc: "operators#52 L2730 EXISTS` operator"
    sql: |-
      WITH Words AS (
        SELECT 'Intend' as value, 'east' as direction UNION ALL
        SELECT 'Secure', 'north' UNION ALL
        SELECT 'Clarity', 'west'
       )
      SELECT EXISTS( SELECT value FROM Words WHERE direction = 'south' ) as result
    expected:
      rows:
        - [false]
