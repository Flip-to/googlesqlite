spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "operators#1 L644 Field access operator"
    sql: |-
      SELECT
        STRUCT(
          STRUCT('Yonge Street' AS street, 'Canada' AS country)
            AS address).address.country
    expected:
      rows:
        - ["Canada"]
  - desc: "operators#3 L737 Array subscript operator"
    sql: |-
      -- Error. Array index 6 is out of bounds.
      SELECT ["coffee", "tea", "milk"][6] AS item_offset
    expected:
      error:
        contains: ""
  - desc: "operators#4 L742 Array subscript operator"
    sql: |-
      -- Error. Array index 6 is out of bounds.
      SELECT ["coffee", "tea", "milk"][OFFSET(6)] AS item_offset
    expected:
      error:
        contains: ""
  - desc: "operators#6 L809 Map subscript operator"
    sql: |-
      -- ERROR: Key not found in map: "D"
      WITH t AS
        (SELECT MAP_FROM_ARRAY([('A', 1), ('B', 2), ('C', 3)]) AS input_map)
      SELECT
        input_map[KEY('D')] AS map_value
      FROM t
    expected:
      error:
        contains: ""
  - desc: "operators#12 L953 Struct subscript operator"
    sql: |-
      -- Error: Field ordinal 6 is out of bounds in STRUCT
      SELECT STRUCT<INT64, STRING, BOOL>(23, "tea", FALSE)[6] AS field_offset
    expected:
      error:
        contains: ""
  - desc: "operators#13 L958 Struct subscript operator"
    sql: |-
      -- Error: Field ordinal 6 is out of bounds in STRUCT
      SELECT STRUCT<INT64, STRING, BOOL>(23, "tea", FALSE)[OFFSET(6)] AS field_offset
    expected:
      error:
        contains: ""
  - desc: "operators#14 L1010 JSON subscript operator"
    sql: |-
      SELECT json_value.class.students[0]['name'] AS first_student
      FROM
        UNNEST(
          [
            JSON '{"class" : {"students" : [{"name" : "Jane"}]}}',
            JSON '{"class" : {"students" : []}}',
            JSON '{"class" : {"students" : [{"name" : "John"}, {"name": "Jamie"}]}}'])
          AS json_value
    expected:
      rows:
        - ["\"Jane\""]
        - [null]
        - ["\"John\""]
      unordered: true
  - desc: "operators#16 L1095 Protocol buffer map subscript operator"
    sql: |-
      -- ERROR: Key not found in map: 2
      SELECT
        m.purchased[KEY('B')] AS value
      FROM
        (SELECT AS VALUE CAST("purchased { key: 'A' value: 2 }" AS Item)) AS m
    expected:
      error:
        contains: ""
