  - desc: "window-function-calls#10 L729 Compute the number of items within a range"
    setup:
      - |-
        CREATE TABLE Farm AS SELECT 'cat' as animal, 23 as population, 'mammal' as category
          UNION ALL SELECT 'duck', 3, 'bird'
          UNION ALL SELECT 'dog', 2, 'mammal'
          UNION ALL SELECT 'goose', 1, 'bird'
          UNION ALL SELECT 'ox', 2, 'mammal'
          UNION ALL SELECT 'goat', 2, 'mammal'
    sql: |-
      SELECT animal, population, category, COUNT(*)
        OVER (
          ORDER BY population
          RANGE BETWEEN 1 PRECEDING AND 1 FOLLOWING
        ) AS similar_population
      FROM Farm
    expected:
      rows:
        - ["goose",1,"bird",4]
        - ["dog",2,"mammal",5]
        - ["ox",2,"mammal",5]
        - ["goat",2,"mammal",5]
        - ["duck",3,"bird",4]
        - ["cat",23,"mammal",1]
      unordered: true
