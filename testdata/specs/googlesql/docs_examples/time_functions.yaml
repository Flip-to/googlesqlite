  # Verified on BigQuery 2026-09-25.
  - desc: "time_functions#5 L237 PARSE_TIME"
    sql: |-
      -- This produces an error because one of the seconds elements is missing.
      SELECT PARSE_TIME("%I:%M", "07:30:00")
    expected:
      error:
        contains: ""
  # Verified on BigQuery 2026-09-25.
  - desc: "time_functions#6 L271 PARSE_TIME"
    sql: |-
      SELECT PARSE_TIME("%H", "15") as parsed_time
    expected:
      rows:
        - ["15:00:00"]
  # Verified on BigQuery 2026-09-25.
  - desc: "time_functions#8 L319 TIME"
    sql: |-
      SELECT
        TIME(15, 30, 00) as time_hms,
        TIME(TIMESTAMP "2008-12-25 15:30:00+08", "America/Los_Angeles") as time_tstz
    expected:
      rows:
        - ["15:30:00","23:30:00"]
  # Verified on BigQuery 2026-09-25.
  - desc: "time_functions#9 L331 TIME"
    sql: |-
      SELECT TIME(DATETIME "2008-12-25 15:30:00.000000") AS time_dt
    expected:
