# Generated by TestDocsExamples from google/googlesql@d82db99 docs/timestamp_functions.md.
# Expected values are the documented result tables, typed with the
# column types the analyzer reports. Do not edit by hand.
spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "timestamp_functions#2 L324 EXTRACT"
    sql: |-
      SELECT
        EXTRACT(
          DAY
          FROM TIMESTAMP('2008-12-25 05:30:00+00') AT TIME ZONE 'UTC')
          AS the_day_utc,
        EXTRACT(
          DAY
          FROM TIMESTAMP('2008-12-25 05:30:00+00') AT TIME ZONE 'America/Los_Angeles')
          AS the_day_california
    expected:
      rows:
        - [25,24]
  - desc: "timestamp_functions#10 L496 FORMAT_TIMESTAMP"
    sql: |-
      SELECT FORMAT_TIMESTAMP("%c", TIMESTAMP "2050-12-25 15:30:55+00", "UTC")
        AS formatted
    expected:
      rows:
        - ["Sun Dec 25 15:30:55 2050"]
  - desc: "timestamp_functions#11 L507 FORMAT_TIMESTAMP"
    sql: |-
      SELECT FORMAT_TIMESTAMP("%b-%d-%Y", TIMESTAMP "2050-12-25 15:30:55+00")
        AS formatted
    expected:
      rows:
        - ["Dec-25-2050"]
  - desc: "timestamp_functions#12 L518 FORMAT_TIMESTAMP"
    sql: |-
      SELECT FORMAT_TIMESTAMP("%b %Y", TIMESTAMP "2050-12-25 15:30:55+00")
        AS formatted
    expected:
      rows:
        - ["Dec 2050"]
  - desc: "timestamp_functions#13 L529 FORMAT_TIMESTAMP"
    sql: |-
      SELECT FORMAT_TIMESTAMP("%Y-%m-%dT%H:%M:%S%Z", TIMESTAMP "2050-12-25 15:30:55", "UTC")
        AS formatted
    expected:
      rows:
        - ["2050-12-25T15:30:55UTC"]
  - desc: "timestamp_functions#14 L569 PARSE_TIMESTAMP"
    sql: |-
      -- This produces an error because the year element is in different locations.
      SELECT PARSE_TIMESTAMP("%a %b %e %Y %I:%M:%S", "Thu Dec 25 07:30:00 2008")
    expected:
      error:
        contains: ""
  - desc: "timestamp_functions#15 L569 PARSE_TIMESTAMP"
    sql: |-
      -- This produces an error because one of the year elements is missing.
      SELECT PARSE_TIMESTAMP("%a %b %e %I:%M:%S", "Thu Dec 25 07:30:00 2008")
    expected:
      error:
        contains: ""
  - desc: "timestamp_functions#17 L658 STRING"
    sql: |-
      SELECT STRING(TIMESTAMP "2008-12-25 15:30:00+00", "UTC") AS string
    expected:
      rows:
        - ["2008-12-25 15:30:00+00"]
  - desc: "timestamp_functions#18 L703 TIMESTAMP"
    sql: |-
      SELECT TIMESTAMP("2008-12-25 15:30:00+00") AS timestamp_str
    expected:
      rows:
        - ["2008-12-25 15:30:00+00"]
  - desc: "timestamp_functions#19 L714 TIMESTAMP"
    sql: |-
      SELECT TIMESTAMP("2008-12-25 15:30:00", "America/Los_Angeles") AS timestamp_str
    expected:
