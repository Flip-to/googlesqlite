  # Verified on BigQuery 2026-09-25.
  - desc: "numbering_functions#2 L214 DENSE_RANK"
    sql: |-
      WITH Numbers AS
       (SELECT 1 as x
        UNION ALL SELECT 2
        UNION ALL SELECT 2
        UNION ALL SELECT 5
        UNION ALL SELECT 8
        UNION ALL SELECT 10
        UNION ALL SELECT 10
      )
      SELECT x,
        DENSE_RANK() OVER (ORDER BY x ASC) AS dense_rank
      FROM Numbers
    expected:
      rows:
        - [1,1]
        - [2,2]
        - [2,2]
        - [5,3]
        - [8,4]
        - [10,5]
        - [10,5]
      unordered: true
