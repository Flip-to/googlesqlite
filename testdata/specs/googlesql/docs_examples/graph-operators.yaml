spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "graph-operators#1 L115 Graph concatenation operator"
    sql: |-
      -- This produces an error because the first node of the path to be concatenated
      -- (mid2) isn't equal to the last node of the previous path (mid1).
      MATCH
        p=(src:Account)-[t1:Transfers]->(mid1:Account),
        q=(mid2:Account)-[t2:Transfers]->(dst:Account)
      LET full_path = p || q
    expected:
      error:
        contains: ""
  - desc: "graph-operators#3 L170 Graph concatenation operator"
    sql: |-
      -- Error: `mid1` and `mid2` aren't equal.
      GRAPH FinGraph
      MATCH
        p=(src:Account)-[t1:Transfers]->(mid1:Account),
        q=(mid2:Account)-[t2:Transfers]->(dst:Account)
      LET full_path = p || q
      RETURN TO_JSON(full_path) AS results
    expected:
      error:
        contains: ""
  - desc: "graph-operators#4 L182 Graph concatenation operator"
    sql: |-
      -- Error: a graph path is NULL.
      GRAPH FinGraph
      MATCH
        p=NULL,
        q=(mid:Account)-[t2:Transfers]->(dst:Account)
      LET full_path = p || q
      RETURN TO_JSON(full_path) AS results
    expected:
      error:
        contains: ""
