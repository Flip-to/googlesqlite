cases:
  - desc: "collation-concepts#2 L89 Operations that propagate collation"
    sql: |-
      -- Without collation
      SELECT *
      FROM UNNEST([
        'B',
        'b',
        'a'
      ]) AS character
      ORDER BY character
    expected:
      rows:
        - ["B"]
        - ["a"]
        - ["b"]
  - desc: "collation-concepts#4 L590 Extensions"
    sql: |-
      SELECT *
      FROM UNNEST([
        'a12b',
        'a1b'
      ]) AS ids
      ORDER BY ids COLLATE 'en-us-u-kn-false'
    expected:
      rows:
        - ["a12b"]
        - ["a1b"]
