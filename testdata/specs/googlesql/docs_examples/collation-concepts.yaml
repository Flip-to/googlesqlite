spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  # Verified on BigQuery 2026-09-25.
  - desc: "collation-concepts#1 L70 Operations that propagate collation"
    sql: |-
      -- With collation
      SELECT *
      FROM UNNEST([
        COLLATE('B', 'und:ci'),
        'b',
        'a'
      ]) AS character
      ORDER BY character
    expected:
      rows:
        - ["a"]
        - ["B"]
        - ["b"]
  # Verified on BigQuery 2026-09-25.
  - desc: "collation-concepts#2 L89 Operations that propagate collation"
    sql: |-
      -- Without collation
      SELECT *
      FROM UNNEST([
        'B',
        'b',
        'a'
      ]) AS character
      ORDER BY character
    expected:
      rows:
        - ["B"]
        - ["a"]
        - ["b"]
  - desc: "collation-concepts#3 L574 Extensions"
    sql: |-
      SELECT *
      FROM UNNEST([
        'a12b',
        'a1b'
      ]) AS ids
      ORDER BY ids COLLATE 'en-us-u-kn-true'
    expected:
      rows:
        - ["a1b"]
        - ["a12b"]
  - desc: "collation-concepts#4 L590 Extensions"
    sql: |-
      SELECT *
      FROM UNNEST([
        'a12b',
        'a1b'
      ]) AS ids
      ORDER BY ids COLLATE 'en-us-u-kn-false'
    expected:
      rows:
        - ["a12b"]
        - ["a1b"]
  # Follows BigQuery, not the docs: collation-concepts.md, Caveats, prints the values as orange1, orange2, orange3, dropping the invisible U+2060 WORD JOINER from the inputs. BigQuery returns the strings unchanged, ["oran⁠ge1","⁠orange2","orange3"], in that order.
  # Verified on BigQuery 2026-09-25.
  - desc: "collation-concepts#5 L662 Caveats"
    sql: |-
      SELECT *
        FROM UNNEST([
          COLLATE('oran\u2060ge1', 'und:ci'),
          COLLATE('\u2060orange2', 'und:ci'),
          COLLATE('orange3', 'und:ci')
        ]) AS fruit
        ORDER BY fruit
    expected:
      rows:
        - ["oran⁠ge1"]
        - ["⁠orange2"]
        - ["orange3"]
