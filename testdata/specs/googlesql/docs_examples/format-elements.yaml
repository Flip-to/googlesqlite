cases:
  - desc: "format-elements#3 L547 Format elements for date and time parts"
    sql: |-
      SELECT FORMAT_TIME("%R", TIME "15:30:00") as formatted_time
    expected:
      rows:
        - ["15:30"]
  - desc: "format-elements#4 L557 Format elements for date and time parts"
    sql: |-
      SELECT FORMAT_TIMESTAMP("%b %Y %Ez", TIMESTAMP "2008-12-25 15:30:00+00")
        AS formatted
    expected:
      rows:
        - ["Dec 2008 +00:00"]
  - desc: "format-elements#7 L588 Format elements for date and time parts"
    sql: |-
      SELECT PARSE_TIME('%I:%M:%S %p', '2:23:38 pm') AS parsed_time
    expected:
      rows:
        - ["14:23:38"]
  - desc: "format-elements#10 L844 Format string as bytes"
    sql: |-
      SELECT CAST('Hello' AS BYTES FORMAT 'ASCII') AS string_to_bytes

      -- Displays the bytes output value (b'\x48\x65\x6c\x6c\x6f').
    expected:
      rows:
        - ["SGVsbG8="]
  - desc: "format-elements#34 L2811 Format digits as string"
    sql: |-
      SELECT
        CAST(12 AS STRING FORMAT '999') as a,
        CAST(-12 AS STRING FORMAT '999') as b
    expected:
      rows:
        - ["12","-12"]
