spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "format-elements#3 L547 Format elements for date and time parts"
    sql: |-
      SELECT FORMAT_TIME("%R", TIME "15:30:00") as formatted_time
    expected:
      rows:
        - ["15:30"]
  - desc: "format-elements#4 L557 Format elements for date and time parts"
    sql: |-
      SELECT FORMAT_TIMESTAMP("%b %Y %Ez", TIMESTAMP "2008-12-25 15:30:00+00")
        AS formatted
    expected:
      rows:
        - ["Dec 2008 +00:00"]
  - desc: "format-elements#7 L588 Format elements for date and time parts"
    sql: |-
      SELECT PARSE_TIME('%I:%M:%S %p', '2:23:38 pm') AS parsed_time
    expected:
      rows:
        - ["14:23:38"]
  - desc: "format-elements#9 L729 Format bytes as string"
    sql: |-
      SELECT CAST(b'\x48\x65\x6c\x6c\x6f' AS STRING FORMAT 'ASCII') AS bytes_to_string
    expected:
      rows:
        - ["Hello"]
  - desc: "format-elements#10 L844 Format string as bytes"
    sql: |-
      SELECT CAST('Hello' AS BYTES FORMAT 'ASCII') AS string_to_bytes

      -- Displays the bytes output value (b'\x48\x65\x6c\x6c\x6f').
    expected:
      rows:
        - ["SGVsbG8="]
  - desc: "format-elements#11 L990 Format year part as string"
    sql: |-
      SELECT CAST(DATE '2018-01-30' AS STRING FORMAT 'YYYY') AS date_time_to_string
    expected:
      rows:
        - ["2018"]
  - desc: "format-elements#12 L1077 Format month part as string"
    sql: |-
      SELECT CAST(DATE '2018-01-30' AS STRING FORMAT 'MONTH') AS date_time_to_string
    expected:
      rows:
        - ["JANUARY"]
  - desc: "format-elements#13 L1181 Format day part as string"
    sql: |-
      SELECT CAST(DATE '2018-02-15' AS STRING FORMAT 'DD') AS date_time_to_string
    expected:
      rows:
        - ["15"]
  - desc: "format-elements#14 L1264 Format hour part as string"
    sql: |-
      SELECT CAST(TIME '21:30:00' AS STRING FORMAT 'HH24') AS date_time_to_string
    expected:
      rows:
        - ["21"]
  - desc: "format-elements#15 L1274 Format hour part as string"
    sql: |-
      SELECT CAST(TIME '21:30:00' AS STRING FORMAT 'HH12') AS date_time_to_string
    expected:
      rows:
        - ["09"]
  - desc: "format-elements#16 L1337 Format minute part as string"
    sql: |-
      SELECT CAST(TIME '21:30:00' AS STRING FORMAT 'MI') AS date_time_to_string
    expected:
      rows:
        - ["30"]
  - desc: "format-elements#17 L1427 Format second part as string"
    sql: |-
      SELECT CAST(TIME '21:30:25.16' AS STRING FORMAT 'SS') AS date_time_to_string
    expected:
      rows:
        - ["25"]
  - desc: "format-elements#18 L1437 Format second part as string"
    sql: |-
      SELECT CAST(TIME '21:30:25.16' AS STRING FORMAT 'FF2') AS date_time_to_string
    expected:
      rows:
        - ["16"]
  - desc: "format-elements#19 L1544 Format meridian indicator part as string"
    sql: |-
      SELECT CAST(TIME '21:30:00' AS STRING FORMAT 'PM') AS date_time_to_string
    expected:
      rows:
        - ["PM"]
  - desc: "format-elements#20 L1555 Format meridian indicator part as string"
    sql: |-
      SELECT CAST(TIME '01:30:00' AS STRING FORMAT 'PM') AS date_time_to_string
    expected:
      rows:
        - ["AM"]
  - desc: "format-elements#21 L1633 Format time zone part as string"
    skip: "la_timezone: The docs format TIMESTAMP '2008-12-25 00:00:00+00' with TZH as -08 (America/Los_Angeles); in UTC it is +00."
    sql: |-
      SELECT CAST(TIMESTAMP '2008-12-25 00:00:00+00:00' AS STRING FORMAT 'TZH') AS date_time_to_string
    expected:
      rows:
        - ["-08"]
  - desc: "format-elements#22 L1644 Format time zone part as string"
    sql: |-
      SELECT CAST(TIMESTAMP '2008-12-25 00:00:00+00:00' AS STRING FORMAT 'TZH' AT TIME ZONE 'Asia/Kolkata')
      AS date_time_to_string
    expected:
      rows:
        - ["+05"]
  - desc: "format-elements#23 L1656 Format time zone part as string"
    sql: |-
      SELECT CAST(TIMESTAMP '2008-12-25 00:00:00+00:00' AS STRING FORMAT 'TZM') AS date_time_to_string
    expected:
      rows:
        - ["00"]
  - desc: "format-elements#24 L1667 Format time zone part as string"
    sql: |-
      SELECT CAST(TIMESTAMP '2008-12-25 00:00:00+00:00' AS STRING FORMAT 'TZM' AT TIME ZONE 'Asia/Kolkata')
      AS date_time_to_string
    expected:
      rows:
        - ["30"]
  - desc: "format-elements#25 L1964 Format string as year part"
    sql: |-
      SELECT CAST('18-12-03' AS DATE FORMAT 'YY-MM-DD') AS string_to_date
    expected:
      rows:
        - ["2018-12-03"]
  - desc: "format-elements#26 L2061 Format string as month part"
    sql: |-
      SELECT CAST('DEC 03, 2018' AS DATE FORMAT 'MON DD, YYYY') AS string_to_date
    expected:
      rows:
        - ["2018-12-03"]
  - desc: "format-elements#27 L2134 Format string as day part"
    sql: |-
      SELECT CAST('DECEMBER 03, 2018' AS DATE FORMAT 'MONTH DD, YYYY') AS string_to_date
    expected:
      rows:
        - ["2018-12-03"]
  - desc: "format-elements#28 L2231 Format string as hour part"
    sql: |-
      SELECT CAST('15:30' AS TIME FORMAT 'HH24:MI') AS string_to_date_time
    expected:
      rows:
        - ["15:30:00"]
  - desc: "format-elements#29 L2306 Format string as minute part"
    sql: |-
      SELECT CAST('03:30 P.M.' AS TIME FORMAT 'HH:MI P.M.') AS string_to_date_time
    expected:
      rows:
        - ["15:30:00"]
  # Follows BigQuery, not the docs: format-elements.md, Format string as second part, documents CAST('01:05:07.16' AS TIME FORMAT 'HH24:MI:SS.FF1') as 01:05:07.2. BigQuery rejects the input: "Illegal non-space trailing data '6' in timestamp string".
  - desc: "format-elements#30 L2410 Format string as second part"
    sql: |-
      SELECT CAST('01:05:07.16' AS TIME FORMAT 'HH24:MI:SS.FF1') AS string_to_date_time
    expected:
      error:
        contains: ""
  - desc: "format-elements#31 L2494 Format string as meridian indicator part"
    sql: |-
      SELECT CAST('03:30 P.M.' AS TIME FORMAT 'HH:MI A.M.') AS string_to_date_time
    expected:
      rows:
        - ["15:30:00"]
  # Follows BigQuery, not the docs: format-elements.md, Format string as time zone part, documents 'YYYY.MM.DD HH:MI:SSTZH' as parsing. BigQuery rejects the format: "Format element in category MERIDIAN_INDICATOR is required when format element 'HH' exists".
  - desc: "format-elements#32 L2585 Format string as time zone part"
    sql: |-
      SELECT CAST('2020.06.03 00:00:53+00' AS TIMESTAMP FORMAT 'YYYY.MM.DD HH:MI:SSTZH') AS string_to_date_time
    expected:
      error:
        contains: ""
  # Follows BigQuery, not the docs: format-elements.md, Format numeric type as string: the table trims the output, but the prose says the output has a fixed width with one leading character for the sign. BigQuery returns the padded strings.
  - desc: "format-elements#33 L2705 Format numeric type as string"
    sql: |-
      SELECT input, CAST(input AS STRING FORMAT '$999,999.999') AS output
      FROM UNNEST([1.2, 12.3, 123.456, 1234.56, -12345.678, 1234567.89]) AS input
    expected:
      rows:
        - [1.2,"       $1.200"]
        - [12.3,"      $12.300"]
        - [123.456,"     $123.456"]
        - [1234.56,"   $1,234.560"]
        - [-12345.678," -$12,345.678"]
        - [1234567.89," $###,###.###"]
      unordered: true
  # Follows BigQuery, not the docs: format-elements.md, Format digits as string: the table trims the output. BigQuery returns '  12' and ' -12' (one position per digit element plus one for the sign).
  - desc: "format-elements#34 L2811 Format digits as string"
    sql: |-
      SELECT
        CAST(12 AS STRING FORMAT '999') as a,
        CAST(-12 AS STRING FORMAT '999') as b
    expected:
      rows:
        - ["  12"," -12"]
  # Follows BigQuery, not the docs: format-elements.md, Format decimal point as string: the table trims the output. BigQuery returns ' 12.50'.
  - desc: "format-elements#35 L2863 Format decimal point as string"
    sql: |-
      SELECT CAST(12.5 AS STRING FORMAT '99.99') as a
    expected:
      rows:
        - [" 12.50"]
  - desc: "format-elements#36 L2952 Format sign as string"
    sql: |-
      SELECT
        CAST(12 AS STRING FORMAT 'S99') as a,
        CAST(-12 AS STRING FORMAT 'S99') as b
    expected:
      rows:
        - ["+12","-12"]
  # Follows BigQuery, not the docs: format-elements.md, Format currency symbol as string: the table trims the output. BigQuery returns ' $12' and '-$12'.
  - desc: "format-elements#37 L3020 Format currency symbol as string"
    sql: |-
      SELECT
        CAST(12 AS STRING FORMAT '$99') as a,
        CAST(-12 AS STRING FORMAT '$99') as b
    expected:
      rows:
        - [" $12","-$12"]
  # Follows BigQuery, not the docs: format-elements.md, Format group separator as string: the table trims the output. BigQuery returns '   1,234'.
  - desc: "format-elements#38 L3071 Format group separator as string"
    sql: |-
      SELECT CAST(1234 AS STRING FORMAT '999,999') as a
    expected:
      rows:
        - ["   1,234"]
