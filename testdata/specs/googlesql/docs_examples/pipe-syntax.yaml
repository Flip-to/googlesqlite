spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "pipe-syntax#1 L40 Query comparison"
    setup:
      - |-
        CREATE OR REPLACE TABLE Produce AS (
          SELECT 'apples' AS item, 2 AS sales, 'fruit' AS category
          UNION ALL
          SELECT 'carrots' AS item, 8 AS sales, 'vegetable' AS category
          UNION ALL
          SELECT 'apples' AS item, 7 AS sales, 'fruit' AS category
          UNION ALL
          SELECT 'bananas' AS item, 5 AS sales, 'fruit' AS category
        )
    sql: |-
      SELECT * FROM Produce
    expected:
      rows:
        - ["apples",2,"fruit"]
        - ["carrots",8,"vegetable"]
        - ["apples",7,"fruit"]
        - ["bananas",5,"fruit"]
      unordered: true
  - desc: "pipe-syntax#2 L68 Query comparison"
    setup:
      - |-
        CREATE OR REPLACE TABLE Produce AS (
          SELECT 'apples' AS item, 2 AS sales, 'fruit' AS category
          UNION ALL
          SELECT 'carrots' AS item, 8 AS sales, 'vegetable' AS category
          UNION ALL
          SELECT 'apples' AS item, 7 AS sales, 'fruit' AS category
          UNION ALL
          SELECT 'bananas' AS item, 5 AS sales, 'fruit' AS category
        )
    sql: |-
      SELECT item, COUNT(*) AS num_items, SUM(sales) AS total_sales
      FROM Produce
      WHERE
        item != 'bananas'
        AND category IN ('fruit', 'nut')
      GROUP BY item
      ORDER BY item DESC
    expected:
      rows:
        - ["apples",2,9]
  - desc: "pipe-syntax#3 L86 Query comparison"
    setup:
      - |-
        CREATE OR REPLACE TABLE Produce AS (
          SELECT 'apples' AS item, 2 AS sales, 'fruit' AS category
          UNION ALL
          SELECT 'carrots' AS item, 8 AS sales, 'vegetable' AS category
          UNION ALL
          SELECT 'apples' AS item, 7 AS sales, 'fruit' AS category
          UNION ALL
          SELECT 'bananas' AS item, 5 AS sales, 'fruit' AS category
        )
    sql: |-
      FROM Produce
      |> WHERE
          item != 'bananas'
          AND category IN ('fruit', 'nut')
      |> AGGREGATE COUNT(*) AS num_items, SUM(sales) AS total_sales
         GROUP BY item
      |> ORDER BY item DESC
    expected:
      rows:
        - ["apples",2,9]
