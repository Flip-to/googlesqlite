cases:
  - desc: "aggregate-function-calls#2 L169 HAVING MAX clause"
    sql: |-
      WITH
        Precipitation AS (
          SELECT 2001 AS year, 'spring' AS season, 9 AS inches
          UNION ALL
          SELECT 2001, 'winter', 1
          UNION ALL
          SELECT 2000, 'fall', 3
          UNION ALL
          SELECT 2000, 'summer', 5
          UNION ALL
          SELECT 2000, 'spring', 7
          UNION ALL
          SELECT 2000, 'winter', 2
        )
      SELECT AVG(inches HAVING MAX year) AS average FROM Precipitation
    expected:
      rows:
        - [5]
  - desc: "aggregate-function-calls#4 L243 HAVING MIN clause"
    sql: |-
      WITH
        Precipitation AS (
          SELECT 2001 AS year, 'spring' AS season, 9 AS inches
          UNION ALL
          SELECT 2001, 'winter', 1
          UNION ALL
          SELECT 2000, 'fall', 3
          UNION ALL
          SELECT 2000, 'summer', 5
          UNION ALL
          SELECT 2000, 'spring', 7
          UNION ALL
          SELECT 2000, 'winter', 2
        )
      SELECT AVG(inches HAVING MIN year) AS average FROM Precipitation
    expected:
      rows:
        - [4.25]
  - desc: "aggregate-function-calls#5 L271 Aggregate function examples"
    sql: |-
      SELECT
        COUNT(*) AS total_count,
        COUNT(fruit) AS non_null_count,
        MIN(fruit) AS min,
        MAX(fruit) AS max
      FROM
        (
          SELECT NULL AS fruit
          UNION ALL
          SELECT 'apple' AS fruit
          UNION ALL
          SELECT 'pear' AS fruit
          UNION ALL
          SELECT 'orange' AS fruit
        )
    expected:
