  - desc: "aggregate-function-calls#6 L299 Aggregate function examples"
    sql: |-
      SELECT
        x,
        AVG(x) OVER (ORDER BY x ROWS BETWEEN 1 PRECEDING AND CURRENT ROW) AS avg
