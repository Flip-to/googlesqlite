spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "data-types#1 L340 Ordering arrays"
    skip: "not_in_bigquery: ORDER BY an ARRAY; BigQuery rejects it with \"ORDER BY does not support expressions of type ARRAY\u003cINT64\u003e\"."
    sql: |-
      WITH
        t AS (
          SELECT [1, 2] a UNION ALL
          SELECT [1, NULL] a UNION ALL
          SELECT [0, 1] UNION ALL
          SELECT [0, 1, 4] UNION ALL
          SELECT [0, 1, 5] UNION ALL
          SELECT [3] UNION ALL
          SELECT [] UNION ALL
          SELECT CAST(NULL AS ARRAY<INT64>)
        )
      SELECT a FROM t ORDER BY a
    expected:
      rows:
        - [null]
        - ["[]"]
        - ["[0, 1]"]
        - ["[0, 1, 4]"]
        - ["[0, 1, 5]"]
        - ["[1, NULL]"]
        - ["[1, 2]"]
        - ["[3]"]
  # Verified on BigQuery 2026-09-25.
  - desc: "data-types#2 L496 NULL`s and the array type"
    sql: |-
      SELECT CAST(NULL AS ARRAY<INT64>) IS NULL AS array_is_null
    expected:
      rows:
        - [true]
  - desc: "data-types#3 L511 NULL`s and the array type"
    skip: "docs_artifact: The docs print the NULL array as []: BigQuery's result API renders a NULL ARRAY as an empty array, but the value is NULL (numbers IS NULL is true on BigQuery, as the example's third column shows). The driver returns the NULL."
    sql: |-
      WITH Items AS (
          SELECT [] AS numbers, "Empty array in query" AS description UNION ALL
          SELECT CAST(NULL AS ARRAY<INT64>), "NULL array in query")
        SELECT numbers, description, numbers IS NULL AS numbers_null
        FROM Items
    expected:
      rows:
        - [[],"Empty array in query",false]
        - [[],"NULL array in query",true]
      unordered: true
  # Verified on BigQuery 2026-09-25.
  - desc: "data-types#8 L1147 Geography type"
    sql: |-
      SELECT
        ST_GEOGFROMTEXT('POINT EMPTY') AS a,
        ST_GEOGFROMTEXT('GEOMETRYCOLLECTION EMPTY') AS b
    expected:
      rows:
        - ["GEOMETRYCOLLECTION EMPTY","GEOMETRYCOLLECTION EMPTY"]
  # Verified on BigQuery 2026-09-25.
  - desc: "data-types#9 L1164 Geography type"
    sql: |-
      SELECT
        ST_GEOGFROMTEXT('MULTIPOINT(1 1, 2 2)') AS a,
        ST_GEOGFROMTEXT('GEOMETRYCOLLECTION(POINT(1 1), POINT(2 2))') AS b
    expected:
      rows:
        - ["MULTIPOINT(1 1, 2 2)","MULTIPOINT(1 1, 2 2)"]
  # Verified on BigQuery 2026-09-25.
  - desc: "data-types#13 L3071 Daylight saving time"
    sql: |-
      SELECT
        FORMAT_TIMESTAMP("%c %Z", "2024-03-10 02:30:00 America/Los_Angeles", "UTC") AS two_thirty,
        FORMAT_TIMESTAMP("%c %Z", "2024-03-10 03:30:00 America/Los_Angeles", "UTC") AS three_thirty
    expected:
      rows:
        - ["Sun Mar 10 10:30:00 2024 UTC","Sun Mar 10 10:30:00 2024 UTC"]
  # Verified on BigQuery 2026-09-25.
  - desc: "data-types#14 L3085 Daylight saving time"
    sql: |-
      SELECT
        FORMAT_TIMESTAMP("%c %Z", "2024-03-10 10:30:00 UTC", "America/Los_Angeles") as ten_thirty
    expected:
      rows:
        - ["Sun Mar 10 03:30:00 2024 UTC-7"]
  # Follows BigQuery, not the docs: data-types.md, Daylight saving time, prints "Sun Nov 3 08:30:00 2024 UTC". BigQuery's %c pads the day of month with a space, as C asctime does: "Sun Nov  3 08:30:00 2024 UTC".
  # Verified on BigQuery 2026-09-25.
  - desc: "data-types#15 L3102 Daylight saving time"
    sql: |-
      SELECT
        FORMAT_TIMESTAMP("%c %Z", "2024-11-03 01:30:00 America/Los_Angeles", "UTC") as one_thirty,
        FORMAT_TIMESTAMP("%c %Z", "2024-11-03 02:30:00 America/Los_Angeles", "UTC") as two_thirty
    expected:
      rows:
        - ["Sun Nov  3 08:30:00 2024 UTC","Sun Nov  3 10:30:00 2024 UTC"]
