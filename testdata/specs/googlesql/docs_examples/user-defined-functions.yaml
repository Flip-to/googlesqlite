# Generated by TestDocsExamples from google/googlesql@d82db99 docs/user-defined-functions.md.
# Expected values are the documented result tables, typed with the
# column types the analyzer reports, except where a case says it
# follows BigQuery (see testdata/docs_examples/classification.yaml).
# Cases with `skip:` keep the documented expectation but do not run.
# Do not edit by hand.
spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "user-defined-functions#1 L99 SQL UDF examples"
    sql: |-
      CREATE TEMP FUNCTION AddFourAndDivide(x INT64, y INT64)
      RETURNS DOUBLE
      AS (
        (x + 4) / y
      );
      WITH
        numbers AS (
          SELECT 1 AS val UNION ALL
          SELECT 3 AS val UNION ALL
          SELECT 4 AS val UNION ALL
          SELECT 5 AS val
        )
      SELECT val, AddFourAndDivide(val, 2) AS result
      FROM numbers
    expected:
      rows:
        - [1,2.5]
        - [3,3.5]
        - [4,4]
        - [5,4.5]
      unordered: true
  - desc: "user-defined-functions#2 L130 SQL UDF examples"
    sql: |-
      CREATE TEMP FUNCTION AddFourAndDivideAny(x ANY TYPE, y ANY TYPE)
      AS (
        (x + 4) / y
      );
      SELECT
        AddFourAndDivideAny(3, 4) AS integer_input,
        AddFourAndDivideAny(1.59, 3.14) AS floating_point_input
    expected:
      rows:
        - [1.75,1.7802547770700636]
  - desc: "user-defined-functions#3 L151 SQL UDF examples"
    sql: |-
      CREATE TEMP FUNCTION LastArrayElement(arr ANY TYPE)
      AS (
        arr[ORDINAL(ARRAY_LENGTH(arr))]
      );
      SELECT
        names[OFFSET(0)] AS first_name,
        LastArrayElement(names) AS last_name
      FROM
        (
          SELECT ['Fred', 'McFeely', 'Rogers'] AS names UNION ALL
          SELECT ['Marie', 'Skłodowska', 'Curie']
        )
    expected:
      rows:
        - ["Fred","Rogers"]
        - ["Marie","Curie"]
      unordered: true
  - desc: "user-defined-functions#5 L494 JavaScript UDF examples"
    sql: |-
      CREATE TEMP FUNCTION PlusOne(x DOUBLE)
      RETURNS DOUBLE
      LANGUAGE js
      AS 'return x+1;';
      SELECT val, PlusOne(val) AS result
      FROM UNNEST([1, 2, 3]) AS val
    expected:
      rows:
        - [1,2]
        - [2,3]
        - [3,4]
      unordered: true
  - desc: "user-defined-functions#6 L514 JavaScript UDF examples"
    skip: "nondeterministic: The JavaScript UDF branches on the current hour."
    sql: |-
      CREATE TEMP FUNCTION CustomGreeting(a STRING)
      RETURNS STRING
      LANGUAGE js
      AS r'''
        var d = new Date();
        if (d.getHours() < 12) {
          return 'Good Morning, ' + a + '!';
        } else {
          return 'Good Evening, ' + a + '!';
        }
      ''';
      SELECT CustomGreeting(names) as everyone
      FROM UNNEST(["Hannah", "Max", "Jakob"]) AS names
    expected:
      rows:
        - ["Good Morning, Hannah!"]
        - ["Good Morning, Max!"]
        - ["Good Morning, Jakob!"]
      unordered: true
  - desc: "user-defined-functions#7 L541 JavaScript UDF examples"
    setup:
      - |-
        CREATE FUNCTION MultiplyInputs(x DOUBLE, y DOUBLE)
        RETURNS DOUBLE
        LANGUAGE js
        AS r'''
          return x*y;
        '''
    sql: |-
      WITH numbers AS
        (SELECT 1 AS x, 5 as y
        UNION ALL
        SELECT 2 AS x, 10 as y
        UNION ALL
        SELECT 3 as x, 15 as y)
      SELECT x, y, MultiplyInputs(x, y) as product
      FROM numbers
    expected:
      rows:
        - [1,5,5]
        - [2,10,20]
        - [3,15,45]
      unordered: true
