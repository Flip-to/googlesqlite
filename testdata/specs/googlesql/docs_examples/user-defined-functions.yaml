dialect: googlesql
cases:
  - desc: "user-defined-functions#1 L99 SQL UDF examples"
    sql: |-
      CREATE TEMP FUNCTION AddFourAndDivide(x INT64, y INT64)
      RETURNS DOUBLE
      AS (
        (x + 4) / y
      );
      WITH
        numbers AS (
          SELECT 1 AS val UNION ALL
          SELECT 3 AS val UNION ALL
          SELECT 4 AS val UNION ALL
          SELECT 5 AS val
        )
      SELECT val, AddFourAndDivide(val, 2) AS result
      FROM numbers
    expected:
      rows:
        - [1,2.5]
        - [3,3.5]
        - [4,4]
        - [5,4.5]
      unordered: true
  - desc: "user-defined-functions#2 L130 SQL UDF examples"
    sql: |-
      CREATE TEMP FUNCTION AddFourAndDivideAny(x ANY TYPE, y ANY TYPE)
      AS (
        (x + 4) / y
      );
      SELECT
        AddFourAndDivideAny(3, 4) AS integer_input,
        AddFourAndDivideAny(1.59, 3.14) AS floating_point_input
    expected:
      rows:
        - [1.75,1.7802547770700636]
  - desc: "user-defined-functions#3 L151 SQL UDF examples"
    sql: |-
      CREATE TEMP FUNCTION LastArrayElement(arr ANY TYPE)
      AS (
        arr[ORDINAL(ARRAY_LENGTH(arr))]
      );
      SELECT
        names[OFFSET(0)] AS first_name,
        LastArrayElement(names) AS last_name
      FROM
        (
          SELECT ['Fred', 'McFeely', 'Rogers'] AS names UNION ALL
          SELECT ['Marie', 'Skłodowska', 'Curie']
        )
    expected:
      rows:
        - ["Fred","Rogers"]
        - ["Marie","Curie"]
      unordered: true
