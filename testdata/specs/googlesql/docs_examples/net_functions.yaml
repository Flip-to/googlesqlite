        - ["3031:3233:3435:3637:3839:4041:4243:4445","b\"0123456789@ABCDE\""]
        - ["::ffff:192.0.2.128","b\"\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\x00\\xff\\xff\\xc0\\x00\\x02\\x80\""]
      unordered: true
  - desc: "net_functions#2 L363 NET.IP_NET_MASK"
    sql: |-
