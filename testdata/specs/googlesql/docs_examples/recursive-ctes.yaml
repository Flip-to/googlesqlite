spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "recursive-ctes#1 L38 Create a recursive CTE"
    sql: |-
      WITH RECURSIVE
        CTE_1 AS (
          (SELECT 1 AS iteration UNION ALL SELECT 1 AS iteration)
          UNION ALL
          SELECT iteration + 1 AS iteration FROM CTE_1 WHERE iteration < 3
        )
      SELECT iteration FROM CTE_1
      ORDER BY 1 ASC
    expected:
      rows:
        - [1]
        - [1]
        - [2]
        - [2]
        - [3]
        - [3]
  - desc: "recursive-ctes#2 L67 Create a recursive CTE"
    sql: |-
      WITH RECURSIVE
        CTE_1 AS (
          (SELECT 1 AS iteration UNION ALL SELECT 1 AS iteration)
          UNION DISTINCT
          SELECT iteration + 1 AS iteration FROM CTE_1 WHERE iteration < 3
        )
      SELECT iteration FROM CTE_1
      ORDER BY 1 ASC
    expected:
      rows:
        - [1]
        - [2]
        - [3]
  - desc: "recursive-ctes#3 L114 Explore reachability in a directed acyclic graph (DAG)"
    sql: |-
      WITH RECURSIVE
        GraphData AS (
          --    1          5
          --   / \        / \
          --  2 - 3      6   7
          --      |       \ /
          --      4        8
          SELECT 1 AS from_node, 2 AS to_node UNION ALL
          SELECT 1, 3 UNION ALL
          SELECT 2, 3 UNION ALL
          SELECT 3, 4 UNION ALL
          SELECT 5, 6 UNION ALL
          SELECT 5, 7 UNION ALL
          SELECT 6, 8 UNION ALL
          SELECT 7, 8
        ),
        R AS (
          (SELECT 5 AS node)
          UNION ALL
          (
            SELECT GraphData.to_node AS node
            FROM R
            INNER JOIN GraphData
              ON (R.node = GraphData.from_node)
          )
        )
      SELECT DISTINCT node FROM R ORDER BY node
    expected:
      rows:
        - [5]
        - [6]
        - [7]
        - [8]
