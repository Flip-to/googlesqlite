# Generated by TestDocsExamples from google/googlesql@d82db99 docs/datetime_functions.md.
# Expected values are the documented result tables, typed with the
# column types the analyzer reports. Do not edit by hand.
spec: docs/specs/googlesql/syntax/docs_examples.md
dialect: googlesql
cases:
  - desc: "datetime_functions#5 L269 DATETIME"
    sql: |-
      SELECT
        DATETIME(2008, 12, 25, 05, 30, 00) as datetime_ymdhms,
        DATETIME(TIMESTAMP "2008-12-25 05:30:00+00", "America/Los_Angeles") as datetime_tstz
    expected:
      rows:
        - ["2008-12-25T05:30:00","2008-12-24T21:30:00"]
  - desc: "datetime_functions#6 L318 DATETIME_ADD"
    sql: |-
      SELECT
        DATETIME "2008-12-25 15:30:00" as original_date,
        DATETIME_ADD(DATETIME "2008-12-25 15:30:00", INTERVAL 10 MINUTE) as later
    expected:
      rows:
        - ["2008-12-25T15:30:00","2008-12-25T15:40:00"]
  - desc: "datetime_functions#7 L388 DATETIME_DIFF"
    sql: |-
      SELECT
        DATETIME "2010-07-07 10:20:00" as first_datetime,
        DATETIME "2008-12-25 15:30:00" as second_datetime,
        DATETIME_DIFF(DATETIME "2010-07-07 10:20:00",
          DATETIME "2008-12-25 15:30:00", DAY) as difference
    expected:
      rows:
        - ["2010-07-07T10:20:00","2008-12-25T15:30:00",559]
  - desc: "datetime_functions#8 L402 DATETIME_DIFF"
    sql: |-
      SELECT
        DATETIME_DIFF(DATETIME '2017-10-15 00:00:00',
          DATETIME '2017-10-14 00:00:00', DAY) as days_diff,
        DATETIME_DIFF(DATETIME '2017-10-15 00:00:00',
          DATETIME '2017-10-14 00:00:00', WEEK) as weeks_diff
    expected:
      rows:
        - [1,1]
  - desc: "datetime_functions#9 L430 DATETIME_DIFF"
    sql: |-
      SELECT
        DATETIME_DIFF('2017-12-30 00:00:00',
          '2014-12-30 00:00:00', YEAR) AS year_diff,
        DATETIME_DIFF('2017-12-30 00:00:00',
          '2014-12-30 00:00:00', ISOYEAR) AS isoyear_diff
    expected:
      rows:
        - [3,2]
  - desc: "datetime_functions#10 L451 DATETIME_DIFF"
    sql: |-
      SELECT
        DATETIME_DIFF('2017-12-18', '2017-12-17', WEEK) AS week_diff,
        DATETIME_DIFF('2017-12-18', '2017-12-17', WEEK(MONDAY)) AS week_weekday_diff,
        DATETIME_DIFF('2017-12-18', '2017-12-17', ISOWEEK) AS isoweek_diff
    expected:
      rows:
        - [0,1,1]
  - desc: "datetime_functions#11 L503 DATETIME_SUB"
    sql: |-
      SELECT
        DATETIME "2008-12-25 15:30:00" as original_date,
        DATETIME_SUB(DATETIME "2008-12-25 15:30:00", INTERVAL 10 MINUTE) as earlier
    expected:
      rows:
        - ["2008-12-25T15:30:00","2008-12-25T15:20:00"]
  - desc: "datetime_functions#12 L637 DATETIME_TRUNC"
    sql: |-
      SELECT
        DATETIME "2008-12-25 15:30:00" as original,
        DATETIME_TRUNC(DATETIME "2008-12-25 15:30:00", DAY) as truncated
    expected:
      rows:
        - ["2008-12-25T15:30:00","2008-12-25T00:00:00"]
  - desc: "datetime_functions#13 L653 DATETIME_TRUNC"
    sql: |-
      SELECT
       datetime AS original,
       DATETIME_TRUNC(datetime, WEEK(MONDAY)) AS truncated
      FROM (SELECT DATETIME(TIMESTAMP "2017-11-05 00:00:00+00", "UTC") AS datetime)
    expected:
      rows:
        - ["2017-11-05T00:00:00","2017-10-30T00:00:00"]
  - desc: "datetime_functions#14 L674 DATETIME_TRUNC"
    sql: |-
      SELECT
        DATETIME_TRUNC('2015-06-15 00:00:00', ISOYEAR) AS isoyear_boundary,
        EXTRACT(ISOYEAR FROM DATETIME '2015-06-15 00:00:00') AS isoyear_number
    expected:
      rows:
        - ["2014-12-29T00:00:00",2015]
  - desc: "datetime_functions#15 L751 EXTRACT"
    sql: |-
      SELECT EXTRACT(HOUR FROM DATETIME(2008, 12, 25, 15, 30, 00)) as hour
    expected:
      rows:
        - [15]
  - desc: "datetime_functions#18 L841 FORMAT_DATETIME"
    sql: |-
      SELECT
        FORMAT_DATETIME("%c", DATETIME "2008-12-25 15:30:00")
        AS formatted
    expected:
      rows:
        - ["Thu Dec 25 15:30:00 2008"]
  - desc: "datetime_functions#19 L853 FORMAT_DATETIME"
    sql: |-
      SELECT
        FORMAT_DATETIME("%b-%d-%Y", DATETIME "2008-12-25 15:30:00")
        AS formatted
    expected:
      rows:
        - ["Dec-25-2008"]
  - desc: "datetime_functions#20 L865 FORMAT_DATETIME"
    sql: |-
      SELECT
        FORMAT_DATETIME("%b %Y", DATETIME "2008-12-25 15:30:00")
        AS formatted
    expected:
      rows:
        - ["Dec 2008"]
  - desc: "datetime_functions#21 L915 LAST_DAY"
    sql: |-
      SELECT LAST_DAY(DATETIME '2008-11-25', MONTH) AS last_day
    expected:
      rows:
        - ["2008-11-30"]
  - desc: "datetime_functions#22 L925 LAST_DAY"
    sql: |-
      SELECT LAST_DAY(DATETIME '2008-11-25') AS last_day
    expected:
      rows:
        - ["2008-11-30"]
  - desc: "datetime_functions#23 L937 LAST_DAY"
    sql: |-
      SELECT LAST_DAY(DATETIME '2008-11-25 15:30:00', YEAR) AS last_day
    expected:
      rows:
        - ["2008-12-31"]
  - desc: "datetime_functions#24 L949 LAST_DAY"
    sql: |-
      SELECT LAST_DAY(DATETIME '2008-11-10 15:30:00', WEEK(SUNDAY)) AS last_day
    expected:
      rows:
        - ["2008-11-15"]
  - desc: "datetime_functions#25 L961 LAST_DAY"
    sql: |-
      SELECT LAST_DAY(DATETIME '2008-11-10 15:30:00', WEEK(MONDAY)) AS last_day
    expected:
      rows:
        - ["2008-11-16"]
  - desc: "datetime_functions#34 L1166 PARSE_DATETIME"
    sql: |-
      -- This produces an error because the year element is in different locations.
      SELECT PARSE_DATETIME("%a %b %e %Y %I:%M:%S", "Thu Dec 25 07:30:00 2008")
    expected:
      error:
        contains: ""
  - desc: "datetime_functions#35 L1166 PARSE_DATETIME"
    sql: |-
      -- This produces an error because one of the year elements is missing.
      SELECT PARSE_DATETIME("%a %b %e %I:%M:%S", "Thu Dec 25 07:30:00 2008")
    expected:
      error:
        contains: ""
  - desc: "datetime_functions#36 L1225 PARSE_DATETIME"
    sql: |-
      SELECT PARSE_DATETIME('%Y-%m-%d %H:%M:%S', '1998-10-18 13:45:55') AS datetime
    expected:
      rows:
        - ["1998-10-18T13:45:55"]
  - desc: "datetime_functions#37 L1235 PARSE_DATETIME"
    sql: |-
      SELECT PARSE_DATETIME('%m/%d/%Y %I:%M:%S %p', '8/30/2018 2:23:38 pm') AS datetime
    expected:
      rows:
        - ["2018-08-30T14:23:38"]
  - desc: "datetime_functions#38 L1249 PARSE_DATETIME"
    sql: |-
      SELECT PARSE_DATETIME('%A, %B %e, %Y','Wednesday, December 19, 2018')
        AS datetime
    expected:
      rows:
        - ["2018-12-19T00:00:00"]
