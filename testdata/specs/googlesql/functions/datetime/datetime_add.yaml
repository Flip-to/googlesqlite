spec: docs/specs/googlesql/functions/datetime/datetime_add.md
dialect: googlesql
cases:
  - desc: add interval
    sql: SELECT CAST(DATETIME_ADD(DATETIME "2024-03-15T12:00:00", INTERVAL 1 DAY) AS STRING)
    # CAST(DATETIME AS STRING) uses a space separator
    # (googlesql compliance/testdata/cast_function.test).
    expected:
      rows:
        - ["2024-03-16 12:00:00"]
