spec: docs/specs/googlesql/functions/datetime/parse_datetime.md
dialect: googlesql
cases:
  - desc: ISO datetime
    sql: SELECT CAST(PARSE_DATETIME("%Y-%m-%dT%H:%M:%S", "2024-03-15T12:30:45") AS STRING)
    # CAST(DATETIME AS STRING) uses a space separator
    # (googlesql compliance/testdata/cast_function.test).
    expected:
      rows:
        - ["2024-03-15 12:30:45"]
