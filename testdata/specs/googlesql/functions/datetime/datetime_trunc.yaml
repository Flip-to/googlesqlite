spec: docs/specs/googlesql/functions/datetime/datetime_trunc.md
dialect: googlesql
cases:
  - desc: trunc to hour
    sql: SELECT CAST(DATETIME_TRUNC(DATETIME "2024-03-15T12:30:45", HOUR) AS STRING)
    # CAST(DATETIME AS STRING) uses a space separator
    # (googlesql compliance/testdata/cast_function.test).
    expected:
      rows:
        - ["2024-03-15 12:00:00"]
