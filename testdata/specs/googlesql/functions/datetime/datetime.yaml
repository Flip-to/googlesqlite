spec: docs/specs/googlesql/functions/datetime/datetime.md
dialect: googlesql
cases:
  - desc: construct datetime
    sql: SELECT CAST(DATETIME(2024, 3, 15, 12, 30, 45) AS STRING)
    # CAST(DATETIME AS STRING) uses a space separator
    # (googlesql compliance/testdata/cast_function.test).
    expected:
      rows:
        - ["2024-03-15 12:30:45"]
