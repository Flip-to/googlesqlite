spec: docs/specs/googlesql/functions/geography/st_astext.md
dialect: googlesql
cases:
  - desc: format a point as WKT
    sql: SELECT ST_ASTEXT(ST_GEOGPOINT(1, 2))
    # Verified on BigQuery 2026-09-25: BigQuery writes WKT with no space
    # after the type name.
    expected:
      rows:
        - ['POINT(1 2)']
