spec: docs/specs/googlesql/functions/geography/st_pointn.md
dialect: googlesql
cases:
  - desc: Middle vertex
    sql: |-
      SELECT ST_ASGEOJSON(ST_POINTN(ST_GEOGFROMTEXT('LINESTRING(0 0, 1 0, 2 0)'), 2))
    # Expected: BigQuery's ST_ASGEOJSON output, verified on BigQuery
    # 2026-09-25 (spaces inside braces and around nested arrays).
    expected:
      rows:
        - ['{ "type": "Point", "coordinates": [1, 0] } ']
