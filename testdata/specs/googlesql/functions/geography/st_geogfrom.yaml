spec: docs/specs/googlesql/functions/geography/st_geogfrom.md
dialect: googlesql
cases:
  - desc: dispatch to GeoJSON
    sql: |-
      SELECT ST_ASGEOJSON(ST_GEOGFROM('{"type":"Point","coordinates":[3,4]}'))
    # Expected: BigQuery's ST_ASGEOJSON output, verified on BigQuery
    # 2026-09-25 (spaces inside braces and around nested arrays).
    expected:
      rows:
        - ['{ "type": "Point", "coordinates": [3, 4] } ']
