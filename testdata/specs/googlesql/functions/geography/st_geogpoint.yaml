spec: docs/specs/googlesql/functions/geography/st_geogpoint.md
dialect: googlesql
cases:
  - desc: construct a POINT from lon/lat
    sql: SELECT ST_ASTEXT(ST_GEOGPOINT(1.5, 2.5))
    # Verified on BigQuery 2026-09-25: BigQuery writes WKT with no space
    # after the type name.
    expected:
      rows:
        - ['POINT(1.5 2.5)']
