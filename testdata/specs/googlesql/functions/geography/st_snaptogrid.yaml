spec: docs/specs/googlesql/functions/geography/st_snaptogrid.md
dialect: googlesql
cases:
  - desc: snap to 0.1 grid
    sql: |-
      SELECT ST_ASGEOJSON(ST_SNAPTOGRID(ST_GEOGFROMTEXT('POINT(0.123 0.456)'), 0.1))
    # Expected: BigQuery's ST_ASGEOJSON output, verified on BigQuery
    # 2026-09-25 (spaces inside braces and around nested arrays).
    expected:
      rows:
        - ['{ "type": "Point", "coordinates": [0.1, 0.5] } ']
